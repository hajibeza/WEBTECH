<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register — Fior Flower Shop</title>
  <link href="https://fonts.googleapis.com/css?family=Poppins:400,600,700&display=swap" rel="stylesheet">
  <link href="css/shop.css" rel="stylesheet" />
  <style>
    .register-wrapper { min-height: 80vh; display: flex; align-items: center; justify-content: center; }
    .register-card {
      background: #fff; border-radius: 16px; box-shadow: 0 4px 32px rgba(0,0,0,.10);
      padding: 48px 40px; width: 100%; max-width: 420px;
    }
    .register-card h1 { font-size: 1.6rem; margin-bottom: 8px; }
    .register-card p { color: #666; margin-bottom: 20px; font-size: .95rem; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 6px; font-size: .9rem; }
    .form-group input {
      width: 100%; padding: 10px 14px; border: 1.5px solid #ddd; border-radius: 8px;
      font-size: 1rem; box-sizing: border-box;
    }
    .form-group input:focus { outline: none; border-color: #b97a57; }
    .btn-register {
      width: 100%; padding: 12px; background: #b97a57; color: #fff;
      border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    #registerMessage { margin-top: 14px; text-align: center; font-size: .9rem; color: #c0392b; min-height: 20px; }
    #registerMessage.success { color: #27ae60; }
    .login-link { text-align: center; margin-top: 8px; }
    .login-link a { color: #b97a57; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="nav" aria-label="Main navigation">
      <a class="brand" href="index.html">Fior</a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a class="cart-pill" href="cart.html">Cart <span id="cartCount">0</span></a>
        <a href="login.html" data-auth-link>Login</a>
      </div>
    </nav>
  </header>

  <main class="register-wrapper">
    <div class="register-card">
      <h1>Create account</h1>
      <p>Register to start shopping with Fior.</p>
      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="registerFirstName">First name</label>
          <input type="text" id="registerFirstName" name="firstName" required autocomplete="given-name" />
        </div>
        <div class="form-group">
          <label for="registerEmail">Email</label>
          <input type="email" id="registerEmail" name="email" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="registerPassword">Password</label>
          <input type="password" id="registerPassword" name="password" required autocomplete="new-password" />
        </div>
        <button type="submit" class="btn-register">Register</button>
      </form>
      <p id="registerMessage"></p>
      <p class="login-link">Already have account? <a href="login.html">Login</a></p>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="displayYear"></span> Fior Flower Shop.</p>
  </footer>

  <script src="js/custom.js"></script>
  <script src="js/cart-core.js"></script>
  <script src="js/nav-cart-count.js"></script>
  <script src="js/auth-nav.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
